<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DSE 數學操卷神器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=20260920d" />
</head>
<body>
  <header>
    <div class="wrap">
      <div class="title-row">
        <div>
          <h1>DSE 數學操卷神器</h1>
          <div class="sub">自己用／小班用 · 資料存在呢部瀏覽器 · 可過檔 QR 或匯出 JSON</div>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab on" data-view="tracker">進度</button>
        <button class="tab" data-view="ability">能力</button>
        <button class="tab" data-view="mc">MC</button>
        <button class="tab" data-view="grades">成績</button>
        <button class="tab" data-view="items">全港平均</button>
        <button class="tab" data-view="cutoffs">Cut-off</button>
        <button class="tab" data-view="class" id="classTab" hidden>班況</button>
        <button class="tab" data-view="timer">計時</button>
      </nav>
      <div class="toolbar" id="peopleBar">
        <label>學生 <select id="profile"></select></label>
        <label id="profileClassWrap" hidden>班
          <select id="profileClass"></select>
        </label>
        <input id="newProfile" type="text" placeholder="新增名稱" />
        <button type="button" id="addProfile">新增</button>
        <button type="button" class="ghost" id="renameProfile">改名</button>
        <button type="button" class="danger" id="delProfile">刪除</button>
        <label>過檔
          <select id="xferMenu">
            <option value="">選擇動作</option>
            <option value="scan">掃入鏡頭</option>
            <option value="show">出示 QR Code</option>
            <option value="export">匯出 JSON（當前學生）</option>
            <option value="import">匯入 JSON 或 zip</option>
            <option value="export-all" class="admin-xfer" hidden>匯出全部學生（一個 JSON）</option>
            <option value="export-class" class="admin-xfer" hidden>匯出呢班（一個 JSON）</option>
            <option value="export-class-zip" class="admin-xfer" hidden>匯出呢班 zip（每人一檔）</option>
          </select>
        </label>
        <button type="button" class="ghost" id="undoBtn">復原標記／分數</button>
        <button type="button" class="ghost" id="classExit" hidden>退出</button>
        <span class="sub admin-xfer" id="adminXferHint" hidden>換機先匯出全部或呢班 JSON</span>
        <input id="importFile" type="file" accept=".json,application/json,text/json,.zip,application/zip" multiple hidden />
        <input id="xferImgFile" type="file" accept="image/*" hidden />
      </div>
      <div id="trackerTheme">
      <div class="toolbar" id="trackerBar">
        <label>試卷 <select id="paper"></select></label>
        <label>篩選
          <select id="cellFilter">
            <option value="all">全部</option>
            <option value="3">已掌握</option>
            <option value="ming">明返</option>
            <option value="2">一般</option>
            <option value="1">唔識</option>
            <option value="0">未做</option>
            <option value="note">有筆記</option>
          </select>
        </label>
        <label id="topicFilterLab" hidden>課題
          <select id="topicFilter"><option value="">全部課題</option></select>
        </label>
        <button type="button" class="ghost" id="clearFilters" hidden>顯示全部題</button>
        <button type="button" class="ghost" id="hitBtn" hidden>顯示命中率</button>
      </div>
      <div class="toolbar batch-apply" id="batchBar">
        <span class="legend-inline">
          <span><i class="dot" style="background:var(--mastered)"></i>已掌握</span>
          <span><i class="dot ming"></i>明返</span>
          <span><i class="dot" style="background:var(--ok)"></i>一般</span>
          <span><i class="dot" style="background:var(--weak)"></i>唔識</span>
          <span><i class="dot" style="background:var(--empty)"></i>未做</span>
        </span>
        <button type="button" class="ghost" id="batchBtn">批量選擇</button>
      </div>
      </div>
      <div class="toolbar" id="mcBar" hidden>
        <label>試卷
          <select id="mcSeries">
            <option value="dse">DSE 必修卷二</option>
            <option value="ce">CE Maths</option>
          </select>
        </label>
        <label id="mcModeLab">模式
          <select id="mcMode">
            <option value="year">本年試題</option>
            <option value="topic">按課題反查</option>
          </select>
        </label>
        <label id="mcYearLab">年份 <select id="mcYear"></select></label>
        <label id="mcQLab">題號 <select id="mcQ"><option value="all">全年</option></select></label>
        <label id="mcTopicLab">課題 <select id="mcTopic"></select></label>
        <label id="mcOrderLab" hidden>年份次序
          <select id="mcOrder">
            <option value="desc">近→遠</option>
            <option value="asc">遠→近</option>
          </select>
        </label>
        <button type="button" class="ghost" id="mcUnseenBtn" hidden>只睇未做</button>
        <button type="button" class="ghost" id="mcHideAnsBtn">隱藏答案</button>
        <button type="button" class="ghost" id="mcOldBtn">含舊課程　開</button>
        <button type="button" class="ghost" id="mcReset">重設</button>
        <span class="mc-now" id="mcNowTopic"></span>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="view on" id="view-tracker">
      <h2 class="page-title">操卷進度</h2>
      <div class="year-jump" id="yearJump"></div>
      <div class="stats" id="stats"></div>
      <p class="hint">短按格改狀態 · 長按或鉛筆寫筆記（批量時唔開） · 分數同操卷日人手填 · 用時由計時批准寫入 · Enter 跳去下一年</p>
      <div id="grid"></div>
      <div class="summary" id="summary"></div>
      <details class="note-list" id="noteList" hidden>
        <summary>筆記一覽</summary>
        <div class="note-filters" id="noteFilters"></div>
        <div id="noteListBody"></div>
      </details>
    </section>
  </main>
</body>
</html>
